<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HumanBase Proof</title>
<style>
  :root { --panel: rgba(22, 26, 32, 0.86); --ink: #eef1f6; --dim: #9aa4b2; --accent: #5dd9b3; --btn: #2b323c; --btn-on: #3d6b5f; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d9dfe6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #panel { position: fixed; right: 12px; top: 12px; bottom: 12px; width: 320px; overflow-y: auto; padding: 12px 14px; border-radius: 12px; background: var(--panel); color: var(--ink); font-size: 12.5px; box-sizing: border-box; }
  #panel h1 { font-size: 15px; margin: 0 0 2px; } #panel .sub { color: var(--dim); margin: 0 0 10px; line-height: 1.4; }
  #panel h2 { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin: 14px 0 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; align-items: center; }
  .row label { color: var(--dim); width: 64px; flex: none; }
  button { background: var(--btn); color: var(--ink); border: 1px solid #3a434f; border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); } button.on { background: var(--btn-on); border-color: var(--accent); }
  #stats { font: 11px/1.45 ui-monospace, Menlo, monospace; white-space: pre; color: #cfd6df; background: rgba(0,0,0,0.25); padding: 8px; border-radius: 6px; }
  #state { position: fixed; left: 12px; top: 10px; padding: 7px 10px; border-radius: 8px; background: rgba(20, 26, 34, 0.72); color: #eef1f6; font: 12px/1.45 ui-monospace, Menlo, monospace; white-space: pre; pointer-events: none; }
  #gate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-size: 15px; color: #333; }
</style>
</head>
<body>
<div id="gate">This is the HumanBase_V1 proof — open it with <code>&nbsp;?humanbase=1&nbsp;</code>.</div>
<div id="state"></div>
<div id="panel"></div>
<!-- DEV-ONLY: the HumanBase_V1 Phase 2 proof (src/dev/vo3d/human/playground). Not part of the app build. -->
<script type="module" src="/src/dev/vo3d/human/playground/main.ts"></script>
</body>
</html>
