<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offshorly Virtual Office</title>
    <!-- Instrument Sans is the single UI typeface for the whole app. Loaded here
         (not via an @import in index.css) so the request starts with the HTML
         instead of waiting on the CSS bundle. The family itself is applied in
         one place only: --vo-font-sans in src/index.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <!-- First-paint ground, inline so it applies BEFORE any CSS/JS bundle
         loads. Without it the browser paints its default white page for the
         moment between navigation and React mounting the loading cover — a
         white flash in front of a dark cover. Keep this color in sync with
         .loading-cover's background in
         src/components/LoadingCover/LoadingCover.css. -->
    <style>
      html,
      body {
        margin: 0;
        background-color: #1b1612;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
