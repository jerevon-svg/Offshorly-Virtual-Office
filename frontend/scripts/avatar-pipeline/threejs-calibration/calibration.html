<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Alex chibi calibration frame</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ---------------------------------------------------------------------
    // CALIBRATION CONFIG — locked settings for the single static front
    // frame, reused as-is by the future 4-direction/animation renderer.
    // ---------------------------------------------------------------------
    const CONFIG = {
      canvas: { width: 600, height: 660 },
      // Camera is orthographic, elevated overhead-ish angle, looking at the
      // character's approximate head/chest center. Angle measured in
      // degrees above the horizontal plane.
      camera: {
        elevationDeg: 55,
        azimuthDeg: 0,       // 0 = straight-on front view
        distance: 5,          // just needs to be far enough to avoid clipping
        frameMarginY: 1.18,   // vertical headroom multiplier
        frameMarginX: 1.18,  // horizontal headroom multiplier
      },
      lights: {
        ambient: { color: 0xfff2e6, intensity: 0.85 },
        keyTop: { color: 0xfff0dd, intensity: 2.6, pos: [0, 6, 0.6] },
        fill: { color: 0xffffff, intensity: 0.75, pos: [-2, 1, 3] },
      },
      colorManagement: {
        outputColorSpace: 'srgb',              // THREE.SRGBColorSpace
        toneMapping: 'none',                    // THREE.NoToneMapping — ACES was tried but
                                                 // desaturates the warm skin highlights too
                                                 // much; plain linear emissiveIntensity below
                                                 // preserves hue/saturation better.
        toneMappingExposure: 1,
      },
      // Model's material is metalness=1/roughness=1 with an emissiveMap
      // (baked "unlit" texture) — scene lights barely affect it, so overall
      // brightness is controlled directly via this linear multiplier instead.
      emissiveIntensity: 1.45,
      modelUrl: '/scripts/avatar-pipeline/output/meshy-test/rig/alex-rigged.glb',
    };
    window.__CALIBRATION_CONFIG__ = CONFIG;

    const canvas = document.getElementById('c');
    canvas.width = CONFIG.canvas.width;
    canvas.height = CONFIG.canvas.height;

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(CONFIG.canvas.width, CONFIG.canvas.height, false);
    renderer.setClearColor(0x000000, 0); // transparent background
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = CONFIG.colorManagement.toneMapping === 'aces'
      ? THREE.ACESFilmicToneMapping
      : THREE.NoToneMapping;
    renderer.toneMappingExposure = CONFIG.colorManagement.toneMappingExposure ?? 1;

    const scene = new THREE.Scene();

    const ambient = new THREE.AmbientLight(CONFIG.lights.ambient.color, CONFIG.lights.ambient.intensity);
    scene.add(ambient);

    const keyTop = new THREE.DirectionalLight(CONFIG.lights.keyTop.color, CONFIG.lights.keyTop.intensity);
    keyTop.position.set(...CONFIG.lights.keyTop.pos);
    scene.add(keyTop);

    const fill = new THREE.DirectionalLight(CONFIG.lights.fill.color, CONFIG.lights.fill.intensity);
    fill.position.set(...CONFIG.lights.fill.pos);
    scene.add(fill);

    const aspect = CONFIG.canvas.width / CONFIG.canvas.height;
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 100);

    function positionCamera(target) {
      const elev = (CONFIG.camera.elevationDeg * Math.PI) / 180;
      const az = (CONFIG.camera.azimuthDeg * Math.PI) / 180;
      const d = CONFIG.camera.distance;
      const x = d * Math.cos(elev) * Math.sin(az);
      const y = d * Math.sin(elev);
      const z = d * Math.cos(elev) * Math.cos(az);
      camera.position.set(target.x + x, target.y + y, target.z + z);
      camera.lookAt(target);
    }

    // Computes the bounding box's extents projected into the camera's local
    // (right, up) space, so we can frame the model exactly regardless of the
    // camera's elevation angle (world-space Y height alone is not a reliable
    // proxy once the camera is tilted).
    function getCameraSpaceExtent(box3, cam) {
      cam.updateMatrixWorld(true);
      const inv = cam.matrixWorldInverse.clone().copy(cam.matrixWorld).invert();
      const corners = [
        new THREE.Vector3(box3.min.x, box3.min.y, box3.min.z),
        new THREE.Vector3(box3.min.x, box3.min.y, box3.max.z),
        new THREE.Vector3(box3.min.x, box3.max.y, box3.min.z),
        new THREE.Vector3(box3.min.x, box3.max.y, box3.max.z),
        new THREE.Vector3(box3.max.x, box3.min.y, box3.min.z),
        new THREE.Vector3(box3.max.x, box3.min.y, box3.max.z),
        new THREE.Vector3(box3.max.x, box3.max.y, box3.min.z),
        new THREE.Vector3(box3.max.x, box3.max.y, box3.max.z),
      ];
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const c of corners) {
        const local = c.clone().applyMatrix4(inv);
        minX = Math.min(minX, local.x);
        maxX = Math.max(maxX, local.x);
        minY = Math.min(minY, local.y);
        maxY = Math.max(maxY, local.y);
      }
      return { minX, maxX, minY, maxY };
    }

    window.__renderComplete = false;
    window.__renderError = null;

    const loader = new GLTFLoader();
    loader.load(
      CONFIG.modelUrl,
      (gltf) => {
        try {
          const model = gltf.scene;
          scene.add(model);

          model.traverse((o) => {
            if (o.isMesh && o.material) {
              o.material.emissiveIntensity = CONFIG.emissiveIntensity;
            }
          });

          // Compute bounding box to center + frame the model.
          const box = new THREE.Box3().setFromObject(model);
          const size = new THREE.Vector3();
          const center = new THREE.Vector3();
          box.getSize(size);
          box.getCenter(center);

          // Re-center model horizontally on X/Z, keep feet at y=0.
          model.position.x -= center.x;
          model.position.z -= center.z;
          model.position.y -= box.min.y;

          // Recompute box after repositioning.
          const box2 = new THREE.Box3().setFromObject(model);
          const size2 = new THREE.Vector3();
          box2.getSize(size2);

          // Frame target: mid-height of the model, aim camera there.
          const target = new THREE.Vector3(0, size2.y * 0.5, 0);

          positionCamera(target);

          // Pass 1: find the bounding box's extent in camera space, then
          // pan the camera (translate along its own right/up axes) so the
          // model is centered on screen — necessary because an elevated
          // camera's projected vertical center does not equal the world
          // bounding-box center.
          const ext1 = getCameraSpaceExtent(box2, camera);
          const centerX = (ext1.minX + ext1.maxX) / 2;
          const centerY = (ext1.minY + ext1.maxY) / 2;
          const right = new THREE.Vector3();
          const up = new THREE.Vector3();
          camera.matrixWorld.extractBasis(right, up, new THREE.Vector3());
          camera.position.addScaledVector(right, centerX);
          camera.position.addScaledVector(up, centerY);
          camera.updateMatrixWorld(true);

          // Pass 2: recompute the now-centered extent and size the ortho
          // frustum to it with margin, picking whichever of height/width
          // is the binding constraint so the model is fully contained.
          const ext2 = getCameraSpaceExtent(box2, camera);
          const halfHeight = (ext2.maxY - ext2.minY) / 2 * CONFIG.camera.frameMarginY;
          const halfWidth = (ext2.maxX - ext2.minX) / 2 * CONFIG.camera.frameMarginX;
          const topFromHeight = halfHeight;
          const topFromWidth = halfWidth / aspect;
          const top = Math.max(topFromHeight, topFromWidth);
          camera.top = top;
          camera.bottom = -top;
          camera.right = top * aspect;
          camera.left = -top * aspect;
          camera.updateProjectionMatrix();

          renderer.render(scene, camera);
          window.__renderComplete = true;
        } catch (err) {
          window.__renderError = String(err && err.stack || err);
        }
      },
      undefined,
      (err) => {
        window.__renderError = String(err && err.stack || err);
      }
    );
  </script>
</body>
</html>
