<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HumanBase Lineup</title>
<style>
  :root { --panel: rgba(22, 26, 32, 0.88); --ink: #eef1f6; --dim: #9aa4b2; --accent: #5dd9b3; --btn: #2b323c; --btn-on: #3d6b5f; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d9dfe6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #panel { position: fixed; right: 12px; top: 12px; bottom: 12px; width: 300px; overflow-y: auto; padding: 12px 14px; border-radius: 12px; background: var(--panel); color: var(--ink); font-size: 12.5px; box-sizing: border-box; }
  #panel h1 { font-size: 15px; margin: 0 0 2px; } #panel .sub { color: var(--dim); margin: 0 0 8px; line-height: 1.4; }
  #panel h2 { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin: 12px 0 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
  button { background: var(--btn); color: var(--ink); border: 1px solid #3a434f; border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); } button.on { background: var(--btn-on); border-color: var(--accent); }
  #label { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); padding: 6px 14px; border-radius: 6px; background: #14161a; color: #7ee0b0; font: 600 14px system-ui, sans-serif; pointer-events: none; }
  #stats { font: 11px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; color: #cfd6df; background: rgba(0,0,0,0.25); padding: 8px; border-radius: 6px; }
  #gate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-size: 15px; color: #333; }
  body.capture #panel, body.capture #label { display: none; }
</style>
</head>
<body>
<div id="gate">HumanBase lineup — open it with <code>&nbsp;?humanbase=1&nbsp;</code>.</div>
<div id="label"></div>
<div id="panel"></div>
<!-- DEV-ONLY: HumanBase permanent lineup (?set=first|batch2|all) (src/dev/vo3d/human/playground/lineup.ts). Not part of the app build. -->
<script type="module" src="/src/dev/vo3d/human/playground/lineup.ts"></script>
</body>
</html>
